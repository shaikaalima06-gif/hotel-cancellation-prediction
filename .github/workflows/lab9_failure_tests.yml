
name: Hotel Cancellation Prediction - Lab 9 Failure Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  failure-handling-tests:
    name: Test Failure Detection and Recovery
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q src pipelines

      # Step 5: Run failure detection and recovery tests
      - name: Run Lab 9 failure handling pipeline
        run: |
          python pipelines/run_lab9_failure_tests.py

      # Step 6: Upload failure reports
      - name: Upload failure test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-recovery-reports
          path: |
            outputs/lab9_failure_recovery_report.json
            outputs/lab9_pipeline_report.json
          if-no-files-found: warn
